name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ruby: [ "3.2", "3.3", "3.4" ]
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Shellcheck the scripts
        run: shellcheck -x skills/messengerr/scripts/*.sh

      - name: Install the messengerr CLI version the docs were generated from
        run: gem install messengerr -v "$(cat .messengerr-version)" --no-document

      - name: Tests (against the real CLI)
        run: MESSENGERR_BIN=messengerr rake test

      - name: references/commands.md matches the real CLI
        run: |
          MESSENGERR_BIN=messengerr ruby build/generate_commands.rb
          git diff --exit-code -- skills/messengerr/references/commands.md .messengerr-version
