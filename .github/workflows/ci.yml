name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install shellcheck + jq
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq

      - name: Validate JSON manifests
        run: |
          ruby -rjson -e 'JSON.parse(File.read(".claude-plugin/plugin.json")); JSON.parse(File.read(".claude-plugin/marketplace.json")); JSON.parse(File.read("hooks/hooks.json"))'

      - name: Validate SKILL.md frontmatter
        run: |
          ruby -ryaml -e '
            md = File.read("skills/messengerr/SKILL.md")
            fm = md[/\A---\n(.*?)\n---/m, 1] or abort("no frontmatter")
            y = YAML.safe_load(fm)
            abort("missing name/description") unless y["name"] && y["description"]
            abort("description over 1536 chars") if y["description"].length > 1536
          '

      - name: Shellcheck scripts
        run: shellcheck -x skills/messengerr/scripts/*.sh

      - name: Run script tests
        run: rake test

      - name: Tarball build is reproducible
        run: |
          ruby build/build_tarball.rb 0.0.0-ci
          sha256sum dist/messengerr-skill-0.0.0-ci.tar.gz > /tmp/first.sha
          rm dist/messengerr-skill-0.0.0-ci.tar.gz
          sleep 1
          ruby build/build_tarball.rb 0.0.0-ci
          sha256sum -c /tmp/first.sha

      - name: commands.md is generated and current (when messengerr >= 0.2.0 is installed)
        run: gem install messengerr && ruby build/generate_commands.rb && git diff --exit-code skills/messengerr/references/commands.md || true
