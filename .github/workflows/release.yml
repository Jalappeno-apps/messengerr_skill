name: Release

# Tag vX.Y.Z (it must match the plugin version and have a dated CHANGELOG entry).
# CI builds the tarball ONCE and attaches it with its .sha256. The messengerr gem
# must pin the hash of THIS released asset, never one built on a laptop (zlib can
# differ between machines, so the compressed bytes can too).

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Optional: create an environment named "release" with required reviewers to add an approval step.
    environment: release
    permissions:
      contents: write   # create the GitHub release
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Tag, versions and changelog agree
        run: ruby build/check_release.rb "$GITHUB_REF_NAME"

      - name: Shellcheck the scripts
        run: shellcheck -x skills/messengerr/scripts/*.sh

      - name: Install the messengerr CLI version the docs were generated from
        run: gem install messengerr -v "$(cat .messengerr-version)" --no-document

      - name: Tests (against the real CLI)
        run: MESSENGERR_BIN=messengerr rake test

      - name: references/commands.md matches the real CLI
        run: |
          MESSENGERR_BIN=messengerr ruby build/generate_commands.rb
          git diff --exit-code -- skills/messengerr/references/commands.md .messengerr-version

      - name: Build the release tarball
        run: |
          ruby build/build_tarball.rb "${GITHUB_REF_NAME#v}"
          (cd dist && sha256sum -c "messengerr-skill-${GITHUB_REF_NAME#v}.tar.gz.sha256")

      - name: Release notes from the changelog
        run: ruby build/check_release.rb "$GITHUB_REF_NAME" --notes > release-notes.md

      - name: Show the hash the gem must pin
        run: |
          {
            echo "### Release asset"
            echo
            echo "Pin this SHA-256 in the messengerr gem (it is the hash of the asset attached to this release):"
            echo
            echo '```'
            cat "dist/messengerr-skill-${GITHUB_REF_NAME#v}.tar.gz.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Third-party action pinned to a commit, not a movable tag (v3.0.3).
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/messengerr-skill-*.tar.gz
            dist/messengerr-skill-*.tar.gz.sha256
