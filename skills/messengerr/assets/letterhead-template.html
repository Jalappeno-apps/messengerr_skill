<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{subject}}</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f4;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%; background-color:#ffffff; border-radius:8px; overflow:hidden;">
          <tr>
            <td style="background-color:#1f2937; padding:20px 28px; color:#ffffff; font-family:Arial, Helvetica, sans-serif; font-size:18px; font-weight:bold;">
              {{sender_name}}
            </td>
          </tr>
          <tr>
            <td style="padding:28px; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:1.6; color:#374151;">
              {{content}}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px; font-family:Arial, Helvetica, sans-serif; font-size:12px; line-height:1.5; color:#9ca3af; border-top:1px solid #e5e7eb;">
              You received this email because you subscribed to updates from {{sender_name}}.
              <br>{{unsubscribe_line}}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
