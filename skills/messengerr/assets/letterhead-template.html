<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EDIT: page title</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f4;">
  <!--
    Starter letterhead for messengerr --html. Table layout and inline styles only, because
    that is what email clients reliably render. EDIT every marked region.
    The only placeholder here is {{name}}: it needs  --map name=<your column>.
    Write the message text in this file, not in a CSV column (CSV values are HTML-escaped).
    Never type double curly braces for anything else, even in comments or CSS: messengerr
    treats them as placeholders and stops the run.
  -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%; background-color:#ffffff;">

          <!-- EDIT: letterhead band (organisation name, or a logo image hosted at a public web address, with alt text) -->
          <tr>
            <td style="background-color:#1f2937; padding:20px 28px; color:#ffffff; font-family:Arial, Helvetica, sans-serif; font-size:18px; font-weight:bold;">
              Your organisation
            </td>
          </tr>

          <!-- EDIT: the message -->
          <tr>
            <td style="padding:28px; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:1.6; color:#374151;">
              <p style="margin:0 0 16px 0;">Hi {{name}},</p>
              <p style="margin:0 0 16px 0;">Write your message here.</p>
              <p style="margin:0;">Regards,<br>Your name</p>
            </td>
          </tr>

          <!-- EDIT: footer. Add whatever your recipients are legally owed (for example an opt-out). -->
          <tr>
            <td style="padding:16px 28px; font-family:Arial, Helvetica, sans-serif; font-size:12px; line-height:1.5; color:#6b7280; border-top:1px solid #e5e7eb;">
              Your organisation, your address.
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
